<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromisedLand Real Estate | Buy Sell Rent Property Tamil Nadu</title>

<meta name="description" content="Buy, Sell & Rent properties across all 38 districts in Tamil Nadu. Premium Real Estate Platform.">
<meta name="keywords" content="Real Estate Tamil Nadu, Buy Land TN, Sell Plot, Rent House">
<meta name="author" content="PromisedLand Real Estate">

<link rel="icon" href="logo.png">

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:#eef2f7;
}

/* HEADER */
header{
background:linear-gradient(90deg,#0b2c5f,#163d82);
color:white;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
}

.logo img{
height:70px;
margin-right:15px;
}

.brand{
font-size:32px;
font-weight:bold;
letter-spacing:1px;
}

.brand span{
font-weight:400;
font-size:20px;
}

.tagline{
font-size:14px;
opacity:0.9;
}

/* LAYOUT */
.container{
display:grid;
grid-template-columns: 1fr 1fr;
gap:30px;
padding:30px 50px;
}

.full-width{
grid-column:1/3;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h2{
margin-top:0;
color:#0b2c5f;
}

input, select, textarea{
width:100%;
padding:10px;
margin:8px 0 15px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

button{
padding:8px 18px;
background:#0b2c5f;
color:white;
border:none;
border-radius:20px;
font-size:13px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1f4ea0;
transform:scale(1.05);
}

/* PROPERTY CARD */
.property{
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:15px;
transition:0.3s;
}

.property:hover{
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.property img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

/* FOOTER */
.footer{
background:#0b2c5f;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
.full-width{
grid-column:1;
}
}
</style>
</head>

<select id="type">

<option>Shop</option>
</select>

<select id="district">

<option>Coimbatore</option>

<input type="text" id="title" placeholder="Area (Sqft / Cent / Acre)">
<input type="number" id="price" placeholder="Price">

<textarea id="description" placeholder="Description"></textarea>

<button onclick="submitProperty()">Submit</button>
</div>

<!-- PROPERTY LIST FULL WIDTH -->

<h2>Available Properties</h2>

</div>

<!-- ADMIN PANEL FULL WIDTH -->

</div>

<div class="footer">
📞 +91 9876543210 | ✉ promisedlandrealestate@email.com
</div>

<script>
const API="https://promisedland-realestate.onrender.com";

async function loadProperties(){
const res=await fetch(API+"/properties?approved=true");
const data=await res.json();
let html="";
data.forEach(p=>{
html+=`
<div class="property">
${p.imageUrls && p.imageUrls.length? `<img src="${p.imageUrls[0]}">`:""}
<h3>${p.title}</h3>
<p><b>District:</b> ${p.district}</p>
<p><b>Price:</b> ₹${p.price}</p>
<p>${p.description}</p>
</div>`;
});
document.getElementById("propertyList").innerHTML=html;
}

async function submitProperty(){
const formData=new FormData();
formData.append("name",name.value);
formData.append("mobile",mobile.value);
formData.append("type",type.value);
formData.append("category",category.value);
formData.append("district",district.value);
formData.append("village",village.value);
formData.append("title",title.value);
formData.append("price",price.value);
formData.append("description",description.value);
for(let i=0;i<images.files.length;i++){
formData.append("images",images.files[i]);
}
await fetch(API+"/properties",{method:"POST",body:formData});
alert("Property submitted. Await admin approval.");
}

async function adminLogin(){
if(document.getElementById("adminPass").value!=="Vs5002190?"){
alert("Wrong password");
return;
}
const res=await fetch(API+"/admin/pending");
const data=await res.json();
let html="<h3>Pending Properties</h3>";
data.forEach(p=>{
html+=`
<div class="property">
<h4>${p.title}</h4>
<p>${p.district}</p>
<button onclick="approve('${p.id}')">Approve</button>
</div>`;
});
document.getElementById("adminArea").innerHTML=html;
}

async function approve(id){
await fetch(API+"/admin/approve/"+id,{method:"POST"});
alert("Approved");
adminLogin();
}

loadProperties();
</script>
