<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Promised Land Real Estate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins;background:#0b1020;color:#fff}
header{background:#0b1020;position:sticky;top:0}
.wrap{max-width:1200px;margin:auto;padding:16px}
.card{background:#11183a;border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:none}
button{background:#f5c16c;border:none;padding:10px;border-radius:8px;font-weight:600;cursor:pointer}
.hide{display:none}
.property{border-bottom:1px solid #333;padding:10px 0}
</style>
</head>

<body>

<header>
<div class="wrap" style="display:flex;align-items:center;gap:16px">
<img src="logo.png" height="60">
<h2>Promised Land Real Estate</h2>
</div>
</header>

<!-- SEARCH -->
<section class="wrap card">
<h3>Search Property</h3>
<div class="grid">
<select id="filterType">
<option value="">Buy / Sell / Rent</option>
<option value="buy">Buy</option>
<option value="sell">Sell</option>
<option value="rent">Rent</option>
</select>

<select id="filterCategory">
<option value="">Property Type</option>
<option>Plot</option>
<option>Agriculture</option>
<option>House</option>
<option>Apartment</option>
<option>Industry</option>
<option>Shop</option>
</select>

<input id="filterDistrict" placeholder="District">
<button onclick="loadProperties()">Search</button>
</div>

<div id="results"></div>
</section>

<!-- POST PROPERTY -->
<section class="wrap card">
<h3>Post Property</h3>

<div class="grid">
<input id="name" placeholder="Person / Company Name">
<input id="mobile" placeholder="Mobile Number">

<select id="ptype">
<option value="sell">Sell</option>
<option value="buy">Buy</option>
<option value="rent">Rent</option>
</select>

<select id="category">
<option>Plot</option>
<option>Agriculture</option>
<option>House</option>
<option>Apartment</option>
<option>Industry</option>
<option>Shop</option>
</select>

<input id="district" placeholder="District">
<input id="village" placeholder="Village">

<input id="area" placeholder="Area (Sqft / Cent / Acre)">
<input id="price" placeholder="Price">

<input type="file" id="image">

<textarea id="desc" placeholder="Description"></textarea>
<button onclick="submitProperty()">Submit Property</button>
</div>
</section>

<!-- ADMIN -->
<section class="wrap card">
<h3>Admin Panel</h3>
<input id="adminPass" type="password" placeholder="Admin Password">
<button onclick="loadAdmin()">Login</button>
<div id="adminPanel"></div>
</section>

<script>
const API = "https://promisedland-realestate.onrender.com";
const ADMIN_PASS = "admin123";

/* LOAD APPROVED PROPERTIES */
async function loadProperties(){
 const res = await fetch(`${API}/properties?approved=true`);
 const data = await res.json();

 results.innerHTML = data.map(p=>`
  <div class="property">
   <b>${p.category}</b> (${p.type})<br>
   Area: ${p.area}<br>
   ₹ ${p.price}<br>
   ${p.village}, ${p.district}<br>
   <a target="_blank"
    href="https://wa.me/91${p.mobile}?text=Interested in your property">
    📲 WhatsApp
   </a>
  </div>
 `).join("");
}

/* SUBMIT PROPERTY */
async function submitProperty(){
 const body={
  name:name.value,
  mobile:mobile.value,
  type:ptype.value,
  category:category.value,
  district:district.value,
  village:village.value,
  area:area.value,
  price:price.value,
  description:desc.value
 };

 const res = await fetch(`${API}/properties`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(body)
 });

 alert("Property submitted. Await admin approval.");

 window.open(
  "https://wa.me/919080581547?text=New property submitted",
  "_blank"
 );
}

/* ADMIN */
async function loadAdmin(){
 if(adminPass.value!==ADMIN_PASS){alert("Wrong password");return;}
 const res = await fetch(`${API}/properties?approved=false`);
 const data = await res.json();

 adminPanel.innerHTML = data.map(p=>`
  <div class="property">
   ${p.category} - ${p.area}<br>
   <button onclick="approve('${p.id}')">Approve</button>
  </div>
 `).join("");
}

async function approve(id){
 await fetch(`${API}/properties/${id}/approve`,{method:"POST"});
 alert("Approved");
 loadAdmin();
}

loadProperties();
</script>

</body>
</html>
