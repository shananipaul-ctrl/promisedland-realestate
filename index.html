<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromisedLand Real Estate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0c3c2f;
  color: white;
  padding: 20px;
  text-align: center;
}

header img {
  width: 120px;
}

header h1 {
  font-size: 36px;
  margin: 5px 0;
}

header p {
  font-size: 16px;
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
  background: white;
}

h2 {
  border-bottom: 2px solid #0c3c2f;
  padding-bottom: 5px;
}

/* FORM */
input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
}

button {
  background: #0c3c2f;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #145a45;
}

.property {
  border: 1px solid #ccc;
  padding: 10px;
  margin: 10px 0;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h1>PROMISEDLAND</h1>
  <p>Real Estate Services | நம்பிக்கையின் நிலம்</p>
</header>

<div class="container">

<h2>🔍 Search Property</h2>
<select id="searchType">
  <option value="">Buy / Sell / Rent</option>
  <option value="buy">Buy</option>
  <option value="sell">Sell</option>
  <option value="rent">Rent</option>
</select>

<select id="searchCategory">
  <option value="">Property Type</option>
  <option value="plot">Plot</option>
  <option value="house">House</option>
  <option value="land">Land</option>
</select>

<select id="searchDistrict"></select>
<input placeholder="Village / Location" id="searchVillage">
<button onclick="loadProperties()">Search</button>

<div id="list"></div>

<hr>

<h2>📝 Post Property</h2>
<input placeholder="Person / Company Name" id="name">
<input placeholder="Mobile Number" id="mobile">
<select id="type">
  <option value="sell">Sell</option>
  <option value="buy">Buy</option>
  <option value="rent">Rent</option>
</select>

<select id="category">
  <option value="plot">Plot</option>
  <option value="house">House</option>
</select>

<select id="district"></select>
<input placeholder="Village / Location" id="village">
<input placeholder="Area (Sqft / Cent / Acre)" id="area">
<input placeholder="Price" id="price">
<textarea placeholder="Description" id="desc"></textarea>
<button onclick="submitProperty()">Submit Property</button>

<hr>

<h2>🔐 Admin Panel</h2>
<input type="password" placeholder="Admin Password" id="adminPass">
<button onclick="adminLogin()">Login</button>

<div id="admin"></div>

</div>

<script>
const API = "https://promisedland-realestate.onrender.com";
let adminToken = "";

/* DISTRICTS */
const districts = [
"Ariyalur","Chengalpattu","Chennai","Coimbatore","Cuddalore","Dharmapuri",
"Dindigul","Erode","Kallakurichi","Kanchipuram","Kanyakumari","Karur",
"Krishnagiri","Madurai","Mayiladuthurai","Nagapattinam","Namakkal",
"Nilgiris","Perambalur","Pudukkottai","Ramanathapuram","Ranipet",
"Salem","Sivagangai","Tenkasi","Thanjavur","Theni","Thoothukudi",
"Tiruchirappalli","Tirunelveli","Tirupattur","Tiruppur","Tiruvallur",
"Tiruvannamalai","Tiruvarur","Vellore","Viluppuram","Virudhunagar"
];

function fillDistricts() {
  const selects = ["district","searchDistrict"];
  selects.forEach(id=>{
    const s=document.getElementById(id);
    s.innerHTML='<option value="">District</option>';
    districts.forEach(d=>{
      s.innerHTML+=`<option>${d}</option>`;
    });
  });
}
fillDistricts();

/* LOAD PROPERTIES */
async function loadProperties(){
  const res = await fetch(`${API}/properties?approved=true`);
  const data = await res.json();
  document.getElementById("list").innerHTML =
    data.map(p=>`
      <div class="property">
        <b>${p.title}</b><br>
        ${p.district}, ${p.village}<br>
        ₹ ${p.price}
      </div>
    `).join("");
}
loadProperties();

/* SUBMIT */
async function submitProperty(){
  await fetch(`${API}/properties`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      name:name.value,
      mobile:mobile.value,
      title:category.value,
      type:type.value,
      category:category.value,
      district:district.value,
      village:village.value,
      price:price.value,
      description:desc.value
    })
  });
  alert("Property submitted. Await admin approval.");
}

/* ADMIN LOGIN */
async function adminLogin(){
  const res = await fetch(`${API}/admin/login`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ password: adminPass.value })
  });

  const data = await res.json();
  if(data.token){
    adminToken = data.token;
    loadPending();
  } else {
    alert("Wrong password");
  }
}

/* LOAD PENDING */
async function loadPending(){
  const res = await fetch(`${API}/admin/pending`);
  const data = await res.json();

  document.getElementById("admin").innerHTML =
    data.map(p=>`
      <div class="property">
        ${p.title} - ${p.district}
        <button onclick="approve('${p.id}')">Approve</button>
      </div>
    `).join("");
}

/* APPROVE */
async function approve(id){
  await fetch(`${API}/admin/approve/${id}`,{
    method:"POST",
    headers:{ "Authorization":`Bearer ${adminToken}` }
  });
  loadPending();
}
</script>

</body>
</html>
