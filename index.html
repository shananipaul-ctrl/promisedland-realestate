<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PromisedLand Real Estate | Tamil Nadu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1020;--card:#11183a;--pri:#f5c16c;--txt:#e9ecff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins;background:var(--bg);color:var(--txt)}
.wrap{max-width:1200px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,textarea,button{width:100%;padding:10px;border-radius:8px;border:none}
button{background:var(--pri);font-weight:600;cursor:pointer}
.property{border:1px solid #2a3470;padding:12px;border-radius:10px}
small{opacity:.8}
.hide{display:none}
</style>
</head>

<body>

<div class="wrap">
<h1>🏡 PromisedLand Real Estate</h1>
<p>Buy • Sell • Rent across Tamil Nadu</p>
</div>

<!-- 🔍 SEARCH -->
<div class="wrap card">
<h3>🔍 Search Properties</h3>
<div class="grid">
<select id="sMode">
  <option value="">Buy / Rent / Sell</option>
  <option>Buy</option>
  <option>Rent</option>
  <option>Sell</option>
</select>

<select id="sCategory">
  <option value="">Property Type</option>
  <option>Plot</option>
  <option>Agriculture</option>
  <option>House</option>
  <option>Apartment</option>
  <option>Industry</option>
  <option>Shop</option>
</select>

<select id="sDistrict"></select>
<select id="sVillage"></select>

<button onclick="loadProperties()">Search</button>
</div>

<div id="results" class="grid"></div>
</div>

<!-- 📝 POST PROPERTY -->
<div class="wrap card">
<h3>📝 Post Property</h3>
<div class="grid">
<input id="oName" placeholder="Owner / Company Name" />
<input id="pMobile" placeholder="Mobile Number" />

<select id="pMode">
  <option>Buy</option>
  <option>Rent</option>
  <option>Sell</option>
</select>

<select id="pCategory">
  <option>Plot</option>
  <option>Agriculture</option>
  <option>House</option>
  <option>Apartment</option>
  <option>Industry</option>
  <option>Shop</option>
</select>

<select id="pDistrict"></select>
<select id="pVillage"></select>

<input id="pPrice" type="number" placeholder="Price" />
<textarea id="pDesc" placeholder="Description"></textarea>

<button onclick="postProperty()">Submit Property</button>
</div>
</div>

<!-- 🤖 AI PRICE (UI READY) -->
<div class="wrap card">
<h3>🤖 AI Land Price Prediction</h3>
<input id="aiArea" placeholder="Area (sqft / cents)" />
<select id="aiDistrict"></select>
<button onclick="predictPrice()">Predict Price</button>
<p id="aiResult"></p>
</div>

<!-- 🔐 ADMIN -->
<div class="wrap card">
<h3>🔐 Admin Approval</h3>
<input id="adminPass" type="password" placeholder="Admin password" />
<button onclick="adminLogin()">Login</button>
<div id="adminPanel"></div>
</div>

<script>
/* ================= CONFIG ================= */
const API = "https://promisedland-realestate.onrender.com";

/* ================= TN DISTRICTS + VILLAGES ================= */
const districts = {
"Ariyalur":["Ariyalur","Sendurai"],
"Chennai":["T Nagar","Velachery","Tambaram"],
"Coimbatore":["Pollachi","Mettupalayam"],
"Cuddalore":["Chidambaram","Panruti"],
"Dharmapuri":["Palacode","Harur"],
"Dindigul":["Palani","Oddanchatram"],
"Erode":["Bhavani","Perundurai"],
"Kallakurichi":["Ulundurpet"],
"Kanchipuram":["Sriperumbudur"],
"Kanyakumari":["Nagercoil","Colachel"],
"Karur":["Kulithalai"],
"Krishnagiri":["Hosur"],
"Madurai":["Melur","Thirumangalam"],
"Mayiladuthurai":["Mayiladuthurai"],
"Nagapattinam":["Vedaranyam"],
"Namakkal":["Rasipuram"],
"Nilgiris":["Ooty","Coonoor"],
"Perambalur":["Perambalur"],
"Pudukkottai":["Alangudi"],
"Ramanathapuram":["Paramakudi"],
"Ranipet":["Arakkonam"],
"Salem":["Attur","Mettur"],
"Sivaganga":["Karaikudi"],
"Tenkasi":["Sankarankovil"],
"Thanjavur":["Kumbakonam"],
"Theni":["Bodinayakanur"],
"Thoothukudi":["Tuticorin"],
"Tiruchirappalli":["Srirangam"],
"Tirunelveli":["Palayamkottai"],
"Tirupathur":["Vaniyambadi"],
"Tiruppur":["Avinashi"],
"Tiruvallur":["Avadi"],
"Tiruvannamalai":["Cheyyar"],
"Tiruvarur":["Mannargudi"],
"Vellore":["Katpadi"],
"Viluppuram":["Gingee"],
"Virudhunagar":["Rajapalayam"]
};

function loadDistricts(sel){
  sel.innerHTML='<option value="">Select District</option>';
  Object.keys(districts).forEach(d=>sel.innerHTML+=`<option>${d}</option>`);
}

function loadVillages(dSel,vSel){
  vSel.innerHTML='<option value="">Select Village</option>';
  (districts[dSel.value]||[]).forEach(v=>vSel.innerHTML+=`<option>${v}</option>`);
}

/* Init selects */
[sDistrict,pDistrict,aiDistrict].forEach(loadDistricts);
sDistrict.onchange=()=>loadVillages(sDistrict,sVillage);
pDistrict.onchange=()=>loadVillages(pDistrict,pVillage);

/* ================= LOAD PROPERTIES ================= */
async function loadProperties(){
  const res = await fetch(API+"/properties");
  const data = await res.json();
  results.innerHTML='';

  data
  .filter(p=>
    (!sMode.value||p.type===sMode.value) &&
    (!sCategory.value||p.category===sCategory.value) &&
    (!sDistrict.value||p.district===sDistrict.value) &&
    (!sVillage.value||p.village===sVillage.value)
  )
  .forEach(p=>{
    results.innerHTML+=`
    <div class="property">
      <b>${p.title}</b><br>
      ${p.category} • ${p.type}<br>
      ${p.village}, ${p.district}<br>
      ₹${p.price}<br>
      📞 ${p.mobile}<br><br>
      <a href="https://wa.me/91${p.mobile}?text=Interested in ${p.title}" target="_blank">
        <button>WhatsApp Enquiry</button>
      </a>
    </div>`;
  });
}

/* ================= POST PROPERTY ================= */
async function postProperty(){
  const body={
    title:oName.value,
    mobile:pMobile.value,
    type:pMode.value,
    category:pCategory.value,
    district:pDistrict.value,
    village:pVillage.value,
    price:pPrice.value,
    description:pDesc.value
  };

  await fetch(API+"/properties",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });

  alert("Property submitted. Await admin approval.");
}

/* ================= AI PRICE (PLACEHOLDER) ================= */
function predictPrice(){
  aiResult.innerText="Estimated price: ₹"+(aiArea.value*3500||"—")+" (AI demo)";
}

/* ================= ADMIN ================= */
function adminLogin(){
  if(adminPass.value==="admin123"){
    adminPanel.innerHTML="<p>Admin logged in. Approval UI coming.</p>";
  }
}

/* Initial load */
loadProperties();
</script>

</body>
</html>
