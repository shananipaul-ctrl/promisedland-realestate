<!DOCTYPE html>
<html>
<head><meta name="description" content="Buy Sell Rent Property in Tamil Nadu - PromisedLand RealEstate">
<meta name="keywords" content="Tamil Nadu property, land for sale, real estate TN">
<meta property="og:title" content="PromisedLand RealEstate">
>
<meta charset="UTF-8">
<title>PROMISEDLAND REALESTATE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}
header{
display:flex;
align-items:center;
padding:20px;
background:rgba(0,0,0,0.6);
}
header img{
height:90px;
margin-right:20px;
}
.brand h1{
margin:0;
font-size:36px;
letter-spacing:2px;
}
.brand span{
font-size:18px;
color:#ccc;
}
.brand p{
margin:0;
font-size:14px;
color:#f5c16c;
}
section{
margin:30px;
padding:25px;
background:rgba(255,255,255,0.1);
border-radius:12px;
backdrop-filter:blur(10px);
}
input,select,textarea{
width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:none;
}
button{
width:100%;
padding:12px;
margin-top:15px;
background:#f5c16c;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
.property-card{
background:#fff;
color:#000;
padding:15px;
border-radius:10px;
margin-top:15px;
}
.property-card img{
width:100%;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<img src="logo.png">
<div class="brand">
<h1>PROMISEDLAND <span>REALESTATE</span></h1>
<p>WHERE YOUR VISION MEETS ITS ADDRESS</p>
</div>
</header>

<section>
<h2>Search Property</h2>

<select id="searchType">
<option value="">Buy/Sell/Rent</option>
<option>Buy</option>
<option>Sell</option>
<option>Rent</option>
</select>

<select id="searchCategory">
<option value="">Property Type</option>
<option>Plot</option>
<option>Land</option>
<option>Agriculture</option>
<option>Apartment</option>
<option>House</option>
<option>Industry</option>
<option>Shop</option>
</select>

<select id="searchDistrict">
<option value="">Select District</option>
</select>

<input id="searchVillage" placeholder="Village / Location">

<button onclick="loadProperties()">Search</button>

<div id="propertyList"></div>
</section>

<section>
<h2>Post Property</h2>

<form id="propertyForm" enctype="multipart/form-data">

<input name="name" placeholder="Person / Company Name" required>
<input name="mobile" placeholder="Mobile Number" required>

<select name="type">
<option>Buy</option>
<option>Sell</option>
<option>Rent</option>
</select>

<select name="category">
<option>Plot</option>
<option>Land</option>
<option>Agriculture</option>
<option>Apartment</option>
<option>House</option>
<option>Industry</option>
<option>Shop</option>
</select>

<select name="district" id="postDistrict"></select>

<input name="village" placeholder="Village / Location">
<input name="area" placeholder="Area (Sqft / Cent / Acre)">
<input name="price" placeholder="Price" required>
<input type="file" name="image">
<textarea name="description" placeholder="Description"></textarea>

<button type="submit">Submit Property</button>

</form>
</section>

<section>
<h2>Admin Panel</h2>
<input type="password" id="adminPassword" placeholder="Admin Password">
<button onclick="adminLogin()">Login</button>
<div id="adminPanel"></div>
</section>
<section>
<h2>Admin Analytics</h2>
<p>Total Properties: <span id="totalProp"></span></p>
<p>Featured: <span id="totalFeatured"></span></p>
<p>Pending: <span id="totalPending"></span></p>
</section>
<script>

const API = "https://promisedland-realestate.onrender.com";
let adminToken = "";

const districts = [
"Ariyalur","Chengalpattu","Chennai","Coimbatore","Cuddalore",
"Dharmapuri","Dindigul","Erode","Kallakurichi","Kanchipuram",
"Kanyakumari","Karur","Krishnagiri","Madurai","Mayiladuthurai",
"Nagapattinam","Namakkal","Nilgiris","Perambalur","Pudukkottai",
"Ramanathapuram","Ranipet","Salem","Sivaganga","Tenkasi",
"Thanjavur","Theni","Thoothukudi","Tiruchirappalli","Tirunelveli",
"Tirupattur","Tiruppur","Tiruvallur","Tiruvannamalai","Tiruvarur",
"Vellore","Viluppuram","Virudhunagar"
];

districts.forEach(d=>{
document.getElementById("searchDistrict").innerHTML += `<option>${d}</option>`;
document.getElementById("postDistrict").innerHTML += `<option>${d}</option>`;
});

async function loadProperties(){
const res = await fetch(API + "/properties");
const data = await res.json();
const list = document.getElementById("propertyList");
list.innerHTML="";
data.forEach(p=>{
list.innerHTML+=`
<div class="property-card">
<img src="${p.imageUrl || 'https://via.placeholder.com/400'}">
<h3>${p.category} - ${p.type}</h3>
<p>${p.district} - ${p.village}</p>
<p>Area: ${p.area}</p>
<p>₹ ${p.price}</p>
<a href="https://wa.me/91${p.mobile}?text=I am interested in your property">WhatsApp Enquiry</a>
</div>`;
});
}

document.getElementById("propertyForm").addEventListener("submit",async e=>{
e.preventDefault();
const formData = new FormData(e.target);

const res = await fetch(API+"/properties",{
method:"POST",
body:formData
});
const data = await res.json();
alert("Property submitted. Await admin approval.");
});

async function adminLogin(){
const pass = document.getElementById("adminPassword").value;
const res = await fetch(API+"/admin/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password:pass})
});
const data = await res.json();
if(data.success){
adminToken=data.token;
loadPending();
}else{
alert("Wrong password");
}
}

async function loadPending(){
const res = await fetch(API+"/admin/pending",{
headers:{Authorization:adminToken}
});
const data = await res.json();
const panel=document.getElementById("adminPanel");
panel.innerHTML="";
data.forEach(p=>{
panel.innerHTML+=`
<div class="property-card">
<p>${p.name} - ${p.mobile}</p>
<p>${p.district}</p>
<button onclick="approve('${p.id}')">Approve</button>
</div>`;
});
}

async function approve(id){
await fetch(API+"/admin/approve/"+id,{
method:"POST",
headers:{Authorization:adminToken}
});
alert("Approved");
loadPending();
}

loadProperties();
<section>
<h2>AI Land Price Estimator</h2>

<input id="aiArea" placeholder="Area (Sqft)">
<input id="aiRate" placeholder="Rate per Sqft">

<button onclick="estimatePrice()">Calculate</button>

<p id="aiResult"></p>
</section>
<section>
<h2>EMI Calculator</h2>

<input id="loanAmount" placeholder="Loan Amount">
<input id="interest" placeholder="Interest %">
<input id="years" placeholder="Years">

<button onclick="calculateEMI()">Calculate EMI</button>

<p id="emiResult"></p>
</section>
<footer style="text-align:center;padding:25px;background:#000;color:#fff;">
<h3>PROMISEDLAND REALESTATE</h3>
<p>📧 rera.promizedland@gmail.com</p>
<p>📞 +91 90805 81547</p>
<p>© 2026 PromisedLand RealEstate. All rights reserved.</p>
</footer>

</script>

</body>
</html>
