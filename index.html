<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PromisedLand RealEstate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }
header {
  display:flex; align-items:center;
  padding:10px 20px; background:#fff;
}
header img { height:70px; margin-right:15px; }
.brand h1 { margin:0; font-size:30px; }
.brand span { font-size:16px; }
.brand p { margin:0; font-size:12px; color:#777; }

section { background:#fff; margin:20px; padding:20px; border-radius:6px; }
input, select, textarea, button {
  width:100%; padding:10px; margin-top:10px;
}
button { background:#2c7; border:none; color:#fff; font-size:16px; cursor:pointer; }

.lang { position:absolute; right:20px; top:20px; }
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <div class="brand">
    <h1>PROMISEDLAND <span>REALESTATE</span></h1>
    <p>WHERE YOUR VISION MEETS ITS ADDRESS</p>
  </div>

  <div class="lang">
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('ta')">TA</button>
  </div>
</header>

<!-- SEARCH -->
<section>
<h2 id="searchTitle">Search Property</h2>

<select id="type">
  <option>Buy</option><option>Sell</option><option>Rent</option>
</select>

<select id="category">
  <option>Plot</option><option>Land</option><option>Agriculture</option>
  <option>Apartment</option><option>House</option><option>Industry</option><option>Shop</option>
</select>

<input placeholder="District">
<input placeholder="Village / Location">
<button>Search</button>
</section>

<!-- POST PROPERTY -->
<section>
<h2 id="postTitle">Post Property</h2>

<input placeholder="Person / Company Name">
<input placeholder="Mobile Number">
<select><option>Buy</option><option>Sell</option><option>Rent</option></select>

<select>
<option>Plot</option><option>Land</option><option>Agriculture</option>
<option>Apartment</option><option>House</option><option>Industry</option><option>Shop</option>
</select>

<input placeholder="District">
<input placeholder="Village">
<input placeholder="Area (Sqft / Cent / Acre)">
<input placeholder="Price">
<input type="file">
<textarea placeholder="Description"></textarea>
<button>Submit Property</button>
</section>

<!-- ADMIN -->
<section>
<h2>Admin Panel</h2>
<input type="password" id="adminPass" placeholder="Admin Password">
<button onclick="adminLogin()">Login</button>
<p id="adminMsg"></p>
</section>

<script>
function adminLogin(){
 fetch("/admin/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({password:adminPass.value})
 }).then(r=>r.json()).then(d=>{
  adminMsg.innerText = d.success ? "Login Success" : "Wrong password";
 });
}

function setLang(l){
 if(l==="ta"){
  searchTitle.innerText="சொத்து தேடல்";
  postTitle.innerText="சொத்து பதிவு";
 }
 else{
  searchTitle.innerText="Search Property";
  postTitle.innerText="Post Property";
 }
}
</script>

</body>
</html>
