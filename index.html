<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromisedLand Real Estate | Buy Sell Rent Property Tamil Nadu</title>

<meta name="description" content="PromisedLand Real Estate – Buy, Sell & Rent properties across all 38 districts in Tamil Nadu. Plots, Land, Agriculture, Apartment, House, Industry, Shop.">
<meta name="keywords" content="Real Estate Tamil Nadu, Buy Land TN, Sell Plot, Rent House, Agriculture Land Tamil Nadu">
<meta name="author" content="PromisedLand Real Estate">
<meta name="robots" content="index, follow">

<link rel="icon" type="image/png" href="logo.png">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

header{
    background:#0b2c5f;
    color:white;
    padding:15px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
}

.logo img{
    height:60px;
    margin-right:15px;
}

.brand{
    font-size:28px;
    font-weight:bold;
}

.brand span{
    font-weight:normal;
}

.tagline{
    font-size:14px;
    opacity:0.9;
}

.container{
    padding:30px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

input, select, textarea{
    width:100%;
    padding:8px;
    margin:5px 0 15px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:8px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#0b2c5f;
    color:white;
    font-size:14px;
}

button:hover{
    background:#163d82;
}

.property{
    border:1px solid #ddd;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
}

.property img{
    width:100%;
    max-height:200px;
    object-fit:cover;
    border-radius:6px;
}

.footer{
    background:#0b2c5f;
    color:white;
    padding:20px;
    text-align:center;
    margin-top:40px;
}

.lang-switch{
    cursor:pointer;
    font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png" alt="PromisedLand Logo">
<div>
<div class="brand">PROMISEDLAND <span>REALESTATE</span></div>
<div class="tagline">Where Your Vision Meets Its Address</div>
</div>
</div>

<div class="lang-switch" onclick="toggleLang()">தமிழ் / English</div>
</header>

<div class="container">

<!-- SEARCH -->
<div class="card">
<h2>Search Property</h2>

<select id="filterType">
<option value="">Buy / Sell / Rent</option>
<option value="buy">Buy</option>
<option value="sell">Sell</option>
<option value="rent">Rent</option>
</select>

<select id="filterCategory">
<option value="">Property Type</option>
<option>Plot</option>
<option>Land</option>
<option>Agriculture</option>
<option>Apartment</option>
<option>House</option>
<option>Industry</option>
<option>Shop</option>
</select>

<select id="filterDistrict">
<option value="">District</option>
<option>Chennai</option>
<option>Coimbatore</option>
<option>Salem</option>
<option>Madurai</option>
<option>Trichy</option>
<option>Tirunelveli</option>
<option>Vellore</option>
<option>Erode</option>
<option>Thanjavur</option>
<option>Dharmapuri</option>
<option>Krishnagiri</option>
<option>Kanchipuram</option>
<option>Namakkal</option>
<option>Dindigul</option>
<option>Karur</option>
<option>Cuddalore</option>
<option>Nagapattinam</option>
<option>Villupuram</option>
<option>Thoothukudi</option>
<option>Sivagangai</option>
<option>Ramanathapuram</option>
<option>Tiruppur</option>
<option>Nilgiris</option>
<option>Perambalur</option>
<option>Ariyalur</option>
<option>Tiruvallur</option>
<option>Virudhunagar</option>
<option>Kanyakumari</option>
<option>Pudukottai</option>
<option>Tiruvarur</option>
<option>Theni</option>
<option>Tirupattur</option>
<option>Ranipet</option>
<option>Kallakurichi</option>
<option>Tenkasi</option>
<option>Mayiladuthurai</option>
<option>Chengalpattu</option>
</select>

<button onclick="loadProperties()">Search</button>
</div>

<!-- PROPERTY LIST -->
<div class="card">
<h2>Available Properties</h2>
<div id="propertyList"></div>
</div>

<!-- POST PROPERTY -->
<div class="card">
<h2>Post Property</h2>

<input type="text" id="name" placeholder="Person / Company Name">
<input type="text" id="mobile" placeholder="Mobile Number">

<select id="type">
<option value="sell">Sell</option>
<option value="buy">Buy</option>
<option value="rent">Rent</option>
</select>

<select id="category">
<option>Plot</option>
<option>Land</option>
<option>Agriculture</option>
<option>Apartment</option>
<option>House</option>
<option>Industry</option>
<option>Shop</option>
</select>

<select id="district">
<option>Chennai</option>
<option>Coimbatore</option>
<option>Salem</option>
<option>Madurai</option>
<option>Trichy</option>
</select>

<input type="text" id="village" placeholder="Village / Location">
<input type="text" id="title" placeholder="Area (Sqft / Cent / Acre)">
<input type="number" id="price" placeholder="Price">
<input type="file" id="images" multiple>
<textarea id="description" placeholder="Description"></textarea>

<button onclick="submitProperty()">Submit</button>
</div>

<!-- ADMIN PANEL -->
<div class="card">
<h2>Admin Panel</h2>
<input type="password" id="adminPass" placeholder="Admin Password">
<button onclick="adminLogin()">Login</button>
<div id="adminArea"></div>
</div>

</div>

<div class="footer">
📞 +91 9876543210 | ✉ promisedlandrealestate@email.com
</div>

<script>
const API = "https://promisedland-realestate.onrender.com";

async function loadProperties(){
    const type = document.getElementById("filterType").value;
    const category = document.getElementById("filterCategory").value;
    const district = document.getElementById("filterDistrict").value;

    let url = API + "/properties?approved=true";

    if(type) url += "&type=" + type;
    if(category) url += "&category=" + category;
    if(district) url += "&district=" + district;

    const res = await fetch(url);
    const data = await res.json();

    const list = document.getElementById("propertyList");
    list.innerHTML = "";

    data.forEach(p=>{
        list.innerHTML += `
        <div class="property">
            ${p.imageUrls && p.imageUrls.length ? `<img src="${p.imageUrls[0]}">` : ""}
            <h3>${p.title}</h3>
            <p><b>District:</b> ${p.district}</p>
            <p><b>Price:</b> ₹${p.price}</p>
            <p>${p.description}</p>
        </div>`;
    });
}

async function submitProperty(){
    const formData = new FormData();
    formData.append("name", name.value);
    formData.append("mobile", mobile.value);
    formData.append("type", type.value);
    formData.append("category", category.value);
    formData.append("district", district.value);
    formData.append("village", village.value);
    formData.append("title", title.value);
    formData.append("price", price.value);
    formData.append("description", description.value);

    const files = images.files;
    for(let i=0;i<files.length;i++){
        formData.append("images", files[i]);
    }

    const res = await fetch(API + "/properties",{
        method:"POST",
        body:formData
    });

    const result = await res.json();
    alert(result.message);
}

async function adminLogin(){
    if(document.getElementById("adminPass").value !== "Vs5002190?"){
        alert("Wrong password");
        return;
    }

    const res = await fetch(API + "/admin/pending");
    const data = await res.json();

    let html = "<h3>Pending Properties</h3>";

    data.forEach(p=>{
        html += `
        <div class="property">
            <h4>${p.title}</h4>
            <p>${p.district}</p>
            <button onclick="approve('${p.id}')">Approve</button>
        </div>`;
    });

    document.getElementById("adminArea").innerHTML = html;
}

async function approve(id){
    await fetch(API + "/admin/approve/" + id,{method:"POST"});
    alert("Approved");
    adminLogin();
}

function toggleLang(){
    alert("Tamil version coming soon 🌍");
}

loadProperties();
</script>

</body>
</html>
